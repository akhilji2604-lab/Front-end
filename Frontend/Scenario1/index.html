
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #198754;
            color: white;
        }

        .remove {
            background: red;
        }

        .summary {
            text-align: right;
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Shopping Cart</h2>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="cart"></tbody>
    </table>

    <div class="summary">
        <p>Subtotal: Rs. <span id="subtotal">0</span></p>
        <p>Discount: Rs. <span id="discount">0</span></p>
        <h3>Amount Payable: Rs. <span id="final">0</span></h3>
    </div>

</div>

<script>

    // Array of objects
    let items = [
        { name: "Notebook", price: 120, qty: 1 },
        { name: "Pen Pack", price: 60, qty: 1 },
        { name: "Water Bottle", price: 350, qty: 1 }
    ];

    // Display cart
    function displayCart() {

        let cart = document.getElementById("cart");
        cart.innerHTML = "";

        if (items.length === 0) {
            cart.innerHTML =
                "<tr><td colspan='5'>Your cart is empty.</td></tr>";

            document.getElementById("subtotal").innerText = 0;
            document.getElementById("discount").innerText = 0;
            document.getElementById("final").innerText = 0;

            return;
        }

        let subtotal = 0;

        items.forEach((item, index) => {

            let total = item.price * item.qty;
            subtotal += total;

            cart.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>Rs. ${item.price}</td>

                    <td>
                        <button onclick="changeQty(${index}, -1)">-</button>
                        ${item.qty}
                        <button onclick="changeQty(${index}, 1)">+</button>
                    </td>

                    <td>Rs. ${total}</td>

                    <td>
                        <button class="remove"
                        onclick="removeItem(${index})">
                        Remove
                        </button>
                    </td>
                </tr>
            `;
        });

        // Apply 10% discount
        let discount = 0;

        if (subtotal >= 1000) {
            discount = subtotal * 0.10;
        }

        let finalAmount = subtotal - discount;

        document.getElementById("subtotal").innerText = subtotal;
        document.getElementById("discount").innerText = discount;
        document.getElementById("final").innerText = finalAmount;
    }

    // Change quantity
    function changeQty(index, value) {

        items[index].qty += value;

        if (items[index].qty < 1) {
            items[index].qty = 1;
        }

        displayCart();
    }

    // Remove item
    function removeItem(index) {

        items.splice(index, 1);

        displayCart();
    }

    // Initial display
    displayCart();

</script>

</body>
</html>
